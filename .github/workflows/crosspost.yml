name: crosspost

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    # Запуск только чтения: действие берётся из trigger.txt (check, probe или audit).
    paths: ['trigger.txt']
  workflow_dispatch:
    inputs:
      action:
        description: 'cron | check | probe | audit | enqueue'
        default: 'cron'
        type: choice
        options: [cron, check, probe, audit, enqueue]
      enqueue_arg:
        description: 'Для enqueue: дата ГГГГ-ММ-ДД или номера постов через запятую'
        default: ''
      platforms:
        description: 'Для enqueue: tg, max или tg,max'
        default: 'tg,max'

permissions:
  contents: write

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ vars.MODE || 'test' }}
      VK_SERVICE_KEY: ${{ secrets.VK_SERVICE_KEY }}
      VK_GROUP: ${{ vars.VK_GROUP || '241671413' }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_TEST_CHAT: ${{ secrets.TG_TEST_CHAT }}
      TG_MAIN_CHAT: ${{ vars.TG_MAIN_CHAT || '-1004297433128' }}
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      MAX_TEST_CHAT: ${{ secrets.MAX_TEST_CHAT }}
      MAX_MAIN_CHAT: ${{ secrets.MAX_MAIN_CHAT || vars.MAX_MAIN_CHAT }}
      ACTION_INPUT: ${{ github.event.inputs.action }}
      ENQUEUE_ARG: ${{ github.event.inputs.enqueue_arg }}
      ENQUEUE_PLATFORMS: ${{ github.event.inputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore state (ветка state)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth=1 origin state
            git show FETCH_HEAD:state.json > data/state.json 2>/dev/null || rm -f data/state.json
            git show FETCH_HEAD:journal.log > data/journal.log 2>/dev/null || rm -f data/journal.log
            git show FETCH_HEAD:report.txt > data/report.txt 2>/dev/null || rm -f data/report.txt
            git show FETCH_HEAD:audit.json > data/audit.json 2>/dev/null || rm -f data/audit.json
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, json, dom

      - name: Корневой сертификат Минцифры (только для MAX)
        run: |
          curl -fsS -m 30 -o data/ca-max.pem https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          fp=$(openssl x509 -in data/ca-max.pem -noout -fingerprint -sha256 | cut -d= -f2)
          [ "$fp" = "D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31" ] || { echo "отпечаток сертификата не совпал"; rm -f data/ca-max.pem; exit 1; }

      - name: Run
        run: |
          set -o pipefail
          action="${ACTION_INPUT}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then action="$(head -n1 trigger.txt | awk '{print $1}')"; fi
          [ -n "$action" ] || action=cron
          case "$action" in
            check|probe|audit) php crosspost.php --$action 2>&1 | tee data/report.txt ;;
            full) { php crosspost.php --probe; echo; php crosspost.php --audit; } 2>&1 | tee data/report.txt ;;
            enqueue) php crosspost.php --enqueue="${ENQUEUE_ARG}" --platforms="${ENQUEUE_PLATFORMS}" 2>&1 | tee data/report.txt ;;
            cron)    php crosspost.php --cron ;;
            *) echo "неизвестное действие"; exit 1 ;;
          esac

      - name: Save state (ветка state)
        if: always()
        run: |
          [ -f data/state.json ] || [ -f data/report.txt ] || exit 0
          d=$(mktemp -d)
          for f in state.json journal.log report.txt audit.json; do [ -f "data/$f" ] && cp "data/$f" "$d/"; done
          cd "$d"
          git init -q
          git config user.name "crosspost-bot"
          git config user.email "crosspost-bot@users.noreply.github.com"
          git checkout -q -b state
          git add -A
          git commit -q -m "state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
